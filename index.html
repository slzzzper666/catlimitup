<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>漲停貓貓</title>
<meta name="theme-color" content="#0b0a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="漲停貓貓">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<style>
  :root {
    --bg: #0b0a0c; --panel: #16131a; --line: #2b2226;
    --up: #ff3d6e; --up-d: #5a1a2a; --cream: #ffe8c2; --text: #f2e8dc; --mute: #8d7f86;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", system-ui, sans-serif; }
  body { height: 100dvh; display: flex; flex-direction: column; overflow-y: auto;
    padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 16px); }
  header { display: flex; align-items: baseline; gap: 10px; padding: 14px 0 10px; }
  header h1 { margin: 0; font-size: 22px; letter-spacing: 1px; }
  header h1 b { color: var(--up); }
  header small { color: var(--mute); font-size: 12px; }

  #stage { position: relative; flex: 1 1 0; min-height: 260px; display: flex; align-items: center; justify-content: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; touch-action: none; }
  #view { max-width: 100%; max-height: 100%; display: none; border-radius: 6px; }
  #empty { text-align: center; padding: 24px; color: var(--mute); line-height: 1.7; }
  #empty .big { font-size: 56px; }
  #hint { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); font-size: 12px;
    background: rgba(0,0,0,.55); padding: 4px 10px; border-radius: 99px; color: var(--cream); display: none; white-space: nowrap; }

  .row { display: flex; gap: 10px; margin-top: 12px; align-items: center; }
  button, .btn { flex: 1; appearance: none; border: 0; border-radius: 14px; padding: 15px 10px; font-size: 16px; font-weight: 700;
    color: var(--text); background: var(--panel); border: 1px solid var(--line); text-align: center; cursor: pointer; }
  button.primary { background: var(--up); border-color: var(--up); color: #fff; }
  button.cream { background: var(--cream); border-color: var(--cream); color: #1a1215; }
  button:disabled { opacity: .4; }
  input[type=file] { display: none; }
  label.slider { flex: 1; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--mute); }
  input[type=range] { flex: 1; accent-color: var(--up); }

  #progress { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 12px; display: none; }
  #progress i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--up), var(--cream)); }
  #status { font-size: 13px; color: var(--mute); text-align: center; min-height: 18px; margin-top: 8px; }

  #result { position: fixed; inset: 0; background: rgba(5,4,6,.94); display: none; flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px); z-index: 10; }
  #result video { flex: 1; min-height: 0; width: 100%; object-fit: contain; border-radius: 12px; background: #000; }
  #result p { font-size: 12px; color: var(--mute); text-align: center; margin: 10px 0 0; line-height: 1.6; }
  details { margin-top: 10px; font-size: 13px; color: var(--mute); }
  details summary { cursor: pointer; padding: 4px 0; }
</style>
</head>
<body>
<header>
  <h1>漲停<b>貓貓</b></h1>
  <small>丟一張漲停截圖，出一支貓貓影片</small>
</header>

<div id="stage">
  <div id="empty"><div class="big">🐱📈</div>先選一張漲停截圖<br><small>截圖只在你的手機裡處理，不會上傳</small></div>
  <canvas id="view"></canvas>
  <div id="hint">拖曳移動貓咪・兩指縮放</div>
</div>

<div class="row" id="adjustRow" style="display:none">
  <label class="slider">大小 <input id="scale" type="range" min="0.4" max="1.3" step="0.01" value="0.85"></label>
  <button id="reset" style="flex:0 0 auto;padding:10px 14px;font-size:13px">重設位置</button>
</div>

<div class="row">
  <label class="btn" for="pick">📷 選截圖</label>
  <input id="pick" type="file" accept="image/*">
  <button id="make" class="primary" disabled>🎬 產生影片</button>
</div>
<div id="progress"><i></i></div>
<div id="status"></div>

<details>
  <summary>進階設定</summary>
  <div class="row"><label class="slider">去綠幕強度 <input id="key" type="range" min="0.05" max="0.5" step="0.01" value="0.22"></label></div>
  <div class="row"><label class="slider">輸出寬度
    <select id="outW" style="flex:1;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px">
      <option value="720" selected>720（快、檔案小）</option><option value="1080">1080（清楚）</option></select></label></div>
  <div class="row"><label class="btn" for="pickVid" style="font-size:13px;padding:10px">換別支綠幕影片</label>
    <input id="pickVid" type="file" accept="video/*"></div>
</details>

<div id="result">
  <video id="out" playsinline controls loop></video>
  <div class="row">
    <button id="again">返回調整</button>
    <button id="save" class="cream">💾 儲存／分享</button>
  </div>
  <p id="saveHint">iPhone：按「儲存／分享」→ 選「儲存影片」就會進相簿</p>
</div>

<video id="cat" src="assets/cats.mp4" playsinline muted loop preload="auto" crossorigin="anonymous" style="display:none"></video>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const view = $('view'), cat = $('cat');
  const gl = view.getContext('webgl', { alpha: false, premultipliedAlpha: false, preserveDrawingBuffer: true });

  // ── 狀態 ──
  // 貓咪影片的位置以「輸出畫面」為基準正規化：寬度比例 s、中心點 (cx, cy)
  // 預設值取自實際貼文：貓群寬約截圖 69%、水平置中、貓群中心落在截圖高度約 60%（五檔報價那一區）
  const DEF = { s: 0.85, cx: 0.5, catY: 0.60 };
  const st = { img: null, W: 720, H: 1280, s: DEF.s, cx: DEF.cx, cy: 0.5, key: 0.22, recording: false };

  // ── WebGL：一個 shader 處理兩種繪圖（背景截圖原樣畫、貓咪做綠幕去背）──
  const vs = `attribute vec2 p; uniform vec4 r; varying vec2 uv;
    void main(){ uv = vec2(p.x, 1.0 - p.y); vec2 q = r.xy + p * r.zw; gl_Position = vec4(q * 2.0 - 1.0, 0.0, 1.0); gl_Position.y *= -1.0; }`;
  const fs = `precision mediump float; varying vec2 uv; uniform sampler2D t; uniform float keyOn, k;
    void main(){
      vec4 c = texture2D(t, vec2(uv.x, 1.0 - uv.y));
      if (keyOn > 0.5) {
        float m = max(c.r, c.b);
        float d = c.g - m;                                   // 綠色比紅藍多多少
        float a = 1.0 - smoothstep(k * 0.45, k, d);          // 越綠越透明，邊緣柔化
        c.g = min(c.g, m + 0.04);                           // 去綠邊（despill）
        gl_FragColor = vec4(c.rgb, a);
      } else gl_FragColor = vec4(c.rgb, 1.0);
    }`;
  function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s); return s; }
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog); gl.useProgram(prog);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0,0, 1,0, 0,1, 0,1, 1,0, 1,1]), gl.STATIC_DRAW);
  const aP = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(aP); gl.vertexAttribPointer(aP, 2, gl.FLOAT, false, 0, 0);
  const uR = gl.getUniformLocation(prog, 'r'), uKeyOn = gl.getUniformLocation(prog, 'keyOn'), uK = gl.getUniformLocation(prog, 'k');
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  function tex() { const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR); return t; }
  const tBg = tex(), tCat = tex();

  function catRect() {                     // 貓咪影片在輸出畫面中的矩形（正規化 0~1）
    const vw = cat.videoWidth || 1080, vh = cat.videoHeight || 1920;
    const w = st.s, h = st.s * st.W * (vh / vw) / st.H;
    return [st.cx - w / 2, st.cy - h / 2, w, h];
  }
  function draw() {
    if (!st.img) return;
    gl.viewport(0, 0, view.width, view.height);
    gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.bindTexture(gl.TEXTURE_2D, tBg); gl.uniform1f(uKeyOn, 0); gl.uniform4f(uR, 0, 0, 1, 1); gl.drawArrays(gl.TRIANGLES, 0, 6);
    if (cat.readyState >= 2) {
      gl.bindTexture(gl.TEXTURE_2D, tCat); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, cat);
      gl.uniform1f(uKeyOn, 1); gl.uniform1f(uK, st.key); gl.uniform4f(uR, ...catRect()); gl.drawArrays(gl.TRIANGLES, 0, 6);
    }
  }
  (function loop() { draw(); requestAnimationFrame(loop); })();

  function setSize(outW) {
    st.W = outW; st.H = Math.round(outW * st.img.height / st.img.width / 2) * 2;     // 影片編碼需要偶數高度
    view.width = st.W; view.height = st.H;
  }
  function resetPos() {
    const vw = cat.videoWidth || 1080, vh = cat.videoHeight || 1920;
    st.s = DEF.s; st.cx = DEF.cx; $('scale').value = st.s;
    const h = st.s * st.W * (vh / vw) / st.H;
    st.cy = DEF.catY - 0.04 * h;           // 素材裡貓群中心約在影片高度 54% 處
  }

  // ── 選截圖 ──
  $('pick').onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    const img = new Image(); img.src = URL.createObjectURL(f); await img.decode();
    st.img = img; setSize(+$('outW').value);
    gl.bindTexture(gl.TEXTURE_2D, tBg); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
    resetPos();
    $('empty').style.display = 'none'; view.style.display = 'block'; $('hint').style.display = 'block';
    $('adjustRow').style.display = 'flex'; $('make').disabled = false; $('status').textContent = '';
    cat.muted = true; cat.play().catch(() => {});
    setTimeout(() => $('hint').style.display = 'none', 3500);
  };
  $('outW').onchange = () => { if (!st.img) return; const { s, cx, cy } = st; setSize(+$('outW').value); Object.assign(st, { s, cx, cy }); };
  $('scale').oninput = (e) => st.s = +e.target.value;
  $('key').oninput = (e) => st.key = +e.target.value;
  $('reset').onclick = resetPos;
  $('pickVid').onchange = (e) => { const f = e.target.files[0]; if (!f) return; cat.src = URL.createObjectURL(f);
    cat.onloadedmetadata = () => { if (st.img) resetPos(); cat.play().catch(() => {}); }; $('status').textContent = '已換成你的綠幕影片'; };

  // ── 拖曳／兩指縮放 ──
  const ptrs = new Map(); let pinch0 = null;
  const toNorm = (e) => { const r = view.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height }; };
  view.addEventListener('pointerdown', (e) => { if (st.recording) return; view.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, toNorm(e)); pinch0 = null; });
  view.addEventListener('pointermove', (e) => {
    if (!ptrs.has(e.pointerId) || st.recording) return;
    const prev = ptrs.get(e.pointerId), cur = toNorm(e); ptrs.set(e.pointerId, cur);
    if (ptrs.size === 1) { st.cx += cur.x - prev.x; st.cy += cur.y - prev.y; }
    else if (ptrs.size === 2) {
      const [a, b] = [...ptrs.values()]; const d = Math.hypot((a.x - b.x) * st.W, (a.y - b.y) * st.H);
      if (!pinch0) pinch0 = { d, s: st.s };
      st.s = Math.min(1.6, Math.max(0.3, pinch0.s * d / pinch0.d)); $('scale').value = st.s;
    }
  });
  const up = (e) => { ptrs.delete(e.pointerId); pinch0 = null; };
  view.addEventListener('pointerup', up); view.addEventListener('pointercancel', up);

  // ── 產生影片：canvas 畫面 + 貓咪影片原聲，用 MediaRecorder 即時錄 ──
  let ac, srcNode, dest, lastBlob;
  function pickMime() {
    const list = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'];
    return list.find((m) => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
  }
  $('make').onclick = async () => {
    if (!window.MediaRecorder || !view.captureStream) { $('status').textContent = '這個瀏覽器不支援錄影，請用 iPhone Safari 或 Android Chrome'; return; }
    st.recording = true; $('make').disabled = true; $('pick').disabled = true;
    $('progress').style.display = 'block'; $('status').textContent = '錄製中…請不要切換 App';
    try {
      if (!ac) { ac = new (window.AudioContext || window.webkitAudioContext)(); srcNode = ac.createMediaElementSource(cat); dest = ac.createMediaStreamDestination(); srcNode.connect(dest); }
      await ac.resume();
      const stream = view.captureStream(30);
      dest.stream.getAudioTracks().forEach((t) => stream.addTrack(t));
      const mime = pickMime();
      const rec = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: st.W >= 1080 ? 10e6 : 6e6 } : undefined);
      const chunks = []; rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
      const done = new Promise((res) => rec.onstop = res);
      cat.pause(); cat.loop = false; cat.muted = false; cat.currentTime = 0;
      await new Promise((r) => cat.onseeked = r);
      rec.start(250); await cat.play();
      const tick = setInterval(() => $('progress').firstElementChild.style.width = (100 * cat.currentTime / cat.duration).toFixed(1) + '%', 100);
      await new Promise((r) => cat.onended = r);
      await new Promise((r) => setTimeout(r, 150));
      rec.stop(); await done; clearInterval(tick);
      stream.getVideoTracks().forEach((t) => t.stop());
      lastBlob = new Blob(chunks, { type: (rec.mimeType || mime || 'video/mp4').split(';')[0] });
      $('out').src = URL.createObjectURL(lastBlob); $('result').style.display = 'flex'; $('out').play().catch(() => {});
      $('status').textContent = `完成：${(lastBlob.size / 1048576).toFixed(1)} MB`;
    } catch (err) {
      $('status').textContent = '錄製失敗：' + (err && err.message || err);
    } finally {
      cat.loop = true; cat.muted = true; cat.onended = null; cat.play().catch(() => {});
      st.recording = false; $('make').disabled = false; $('pick').disabled = false;
      $('progress').style.display = 'none'; $('progress').firstElementChild.style.width = '0';
    }
  };
  $('again').onclick = () => { $('out').pause(); $('result').style.display = 'none'; };
  $('save').onclick = async () => {
    if (!lastBlob) return;
    const ext = lastBlob.type.includes('webm') ? 'webm' : 'mp4';
    const name = `漲停貓貓_${new Date().toISOString().slice(0, 10)}.${ext}`;
    const file = new File([lastBlob], name, { type: lastBlob.type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === 'AbortError') return; }
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(lastBlob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  };

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
