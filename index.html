<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>漲停貓貓</title>
<meta name="theme-color" content="#0e0912">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="漲停貓貓">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="icon" href="assets/icon-192.png">
<style>
  /* 配色：深紫黑底 ＋ 漲停粉（主）／奶油（副）＋ 紫（中性）；只有主按鈕和漲停元素用飽和粉 */
  :root {
    --bg: #0e0912; --glass: rgba(255,255,255,.035); --glass-2: rgba(255,255,255,.06); --edge: rgba(255,255,255,.08);
    --pink: #ff3d7f; --pink-2: #ff7aa8; --cream: #ffe8c2; --violet: #8a5cff;
    --text: #f6eef2; --mute: #9a8ea3;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scrollbar-gutter: stable; }
  html, body { margin: 0; color: var(--text); background: var(--bg);
    font-family: -apple-system, "SF Pro Rounded", "PingFang TC", "Noto Sans TC", system-ui, sans-serif; }
  body {
    min-height: 100dvh;
    padding: calc(env(safe-area-inset-top) + 6px) 16px calc(env(safe-area-inset-bottom) + 14px);
    background:
      radial-gradient(120% 60% at 0% 0%, rgba(255,61,127,.20), transparent 60%),
      radial-gradient(90% 50% at 100% 100%, rgba(138,92,255,.16), transparent 60%),
      var(--bg);
  }

  /* ── 頂部 ── */
  header { display: flex; align-items: center; gap: 12px; padding: 10px 2px 14px; }
  header img { width: 40px; height: 40px; border-radius: 12px; box-shadow: 0 6px 18px rgba(255,61,127,.35); }
  header h1 { margin: 0; font-size: 22px; font-weight: 900; letter-spacing: 2px;
    background: linear-gradient(90deg, var(--cream), var(--pink-2) 70%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .chip { margin-left: auto; font-size: 12px; font-weight: 800; color: var(--pink); padding: 5px 10px; border-radius: 99px;
    background: rgba(255,61,127,.12); border: 1px solid rgba(255,61,127,.35); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(255,61,127,0); background: rgba(255,61,127,.22); } }

  /* ── 舞台 ── */
  #stage { position: relative; height: max(300px, calc(100dvh - 300px - env(safe-area-inset-top) - env(safe-area-inset-bottom))); display: flex; align-items: center; justify-content: center;
    background: var(--glass); border: 1px solid var(--edge); border-radius: 26px; overflow: hidden; touch-action: none;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 20px 50px rgba(0,0,0,.35); }
  #stage.empty { cursor: pointer; }
  #stage.empty::before { content: ""; position: absolute; inset: 12px; border-radius: 18px; border: 2px dashed rgba(255,122,168,.28); pointer-events: none; }
  #stage.empty:active { transform: scale(.99); }
  #stage.drag { background: rgba(255,61,127,.08); }
  #view { max-width: 100%; max-height: 100%; display: none; border-radius: 10px; }
  #empty { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 24px; text-align: center; pointer-events: none; }
  #empty img { width: min(84%, 360px); filter: drop-shadow(0 18px 24px rgba(255,61,127,.28)); }
  #empty .say { font-size: 21px; font-weight: 900; letter-spacing: 1px; color: var(--cream); }
  #hint { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); font-size: 12px; font-weight: 700;
    background: rgba(14,9,18,.75); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 6px 12px; border-radius: 99px; color: var(--cream); border: 1px solid var(--edge); display: none; white-space: nowrap; }

  /* ── 控制列 ── */
  .row { display: flex; gap: 10px; margin-top: 12px; align-items: center; }
  .btn, button { flex: 1; appearance: none; border-radius: 18px; padding: 16px 10px; font-size: 16px; font-weight: 800; letter-spacing: 1px;
    color: var(--text); background: var(--glass-2); border: 1px solid var(--edge); text-align: center; cursor: pointer;
    transition: transform .1s ease, opacity .2s; font-family: inherit; }
  .btn:active, button:active { transform: scale(.97); }
  button.primary { color: #fff; border: 0; background: linear-gradient(135deg, var(--pink), #ff6a5c);
    box-shadow: 0 10px 26px rgba(255,61,127,.38), inset 0 1px 0 rgba(255,255,255,.25); }
  button.cream { color: #2a1520; border: 0; background: var(--cream); box-shadow: 0 10px 24px rgba(255,232,194,.18); }
  button:disabled { opacity: .35; box-shadow: none; }
  input[type=file] { display: none; }
  .pill { flex: 1; display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 16px;
    background: var(--glass); border: 1px solid var(--edge); font-size: 13px; font-weight: 700; color: var(--mute); }
  input[type=range] { flex: 1; accent-color: var(--pink); }
  .ghost { flex: 0 0 auto; padding: 12px 14px; font-size: 13px; border-radius: 14px; }

  #progress { position: relative; height: 8px; background: var(--glass-2); border-radius: 99px; overflow: hidden; margin-top: 14px; display: none; }
  #progress i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--pink), var(--cream)); transition: width .1s linear; }
  #status { font-size: 13px; font-weight: 600; color: var(--mute); text-align: center; min-height: 18px; margin-top: 10px; }

  details { margin-top: 6px; font-size: 13px; color: var(--mute); }
  details summary { cursor: pointer; padding: 8px 2px; font-weight: 700; }
  select { flex: 1; background: transparent; color: var(--text); border: 0; font: inherit; }

  /* ── 結果 ── */
  #result { position: fixed; inset: 0; display: none; flex-direction: column; z-index: 10;
    padding: calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 16px);
    background: rgba(10,6,13,.86); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
  #result h2 { margin: 0 0 12px; font-size: 18px; font-weight: 900; color: var(--cream); text-align: center; letter-spacing: 1px; }
  #result video { flex: 1; min-height: 0; width: 100%; object-fit: contain; border-radius: 20px; background: #000; border: 1px solid var(--edge); }
  #result p { font-size: 12px; color: var(--mute); text-align: center; margin: 12px 0 0; }
</style>
</head>
<body>
<header>
  <img src="assets/icon-192.png" alt="">
  <h1>漲停貓貓</h1>
  <span class="chip">▲ 10.00%</span>
</header>

<label id="stage" class="empty" for="pick">
  <div id="empty"><img src="assets/cat_dance.webp" alt=""><div class="say">給我你的漲停持股吧！！</div></div>
  <canvas id="view"></canvas>
  <div id="hint">拖曳移動貓咪・兩指縮放</div>
</label>

<div class="row" id="adjustRow" style="display:none">
  <label class="pill">大小 <input id="scale" type="range" min="0.4" max="1.3" step="0.01" value="0.85"></label>
  <button id="reset" class="ghost">重設位置</button>
</div>

<div class="row">
  <label class="btn" for="pick" id="pickBtn">選截圖</label>
  <input id="pick" type="file" accept="image/*">
  <button id="make" class="primary" disabled>產生影片</button>
</div>
<div id="progress"><i></i></div>
<div id="status"></div>

<details>
  <summary>進階設定</summary>
  <div class="row"><label class="pill">去綠幕強度 <input id="key" type="range" min="0.05" max="0.5" step="0.01" value="0.22"></label></div>
  <div class="row"><label class="pill">輸出寬度
    <select id="outW"><option value="720" selected>720（快、檔案小）</option><option value="1080">1080（清楚）</option></select></label></div>
  <div class="row"><label class="btn" for="pickVid" style="font-size:13px;padding:12px">換別支綠幕影片</label>
    <input id="pickVid" type="file" accept="video/*"></div>
</details>

<div id="result">
  <h2>漲停貓貓出爐</h2>
  <video id="out" playsinline controls loop></video>
  <div class="row">
    <button id="again">返回調整</button>
    <button id="save" class="cream">儲存/分享</button>
  </div>
  <p>iPhone：按「儲存/分享」→ 分享選單選「儲存影片」就會進相簿</p>
</div>

<video id="cat" src="assets/cats.mp4" playsinline muted loop preload="auto" crossorigin="anonymous" style="display:none"></video>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const view = $('view'), cat = $('cat');
  const gl = view.getContext('webgl', { alpha: false, premultipliedAlpha: false, preserveDrawingBuffer: true });

  // ── 狀態 ──
  // 貓咪影片的位置以「輸出畫面」為基準正規化：寬度比例 s、中心點 (cx, cy)
  // 預設值取自實際貼文：貓群寬約截圖 69%、水平置中、貓群中心落在截圖高度約 60%（五檔報價那一區）
  const DEF = { s: 0.85, cx: 0.5, catY: 0.60 };
  const st = { img: null, W: 720, H: 1280, s: DEF.s, cx: DEF.cx, cy: 0.5, key: 0.22, recording: false };

  // ── WebGL：一個 shader 處理兩種繪圖（背景截圖原樣畫、貓咪做綠幕去背）──
  const vs = `attribute vec2 p; uniform vec4 r; varying vec2 uv;
    void main(){ uv = vec2(p.x, 1.0 - p.y); vec2 q = r.xy + p * r.zw; gl_Position = vec4(q * 2.0 - 1.0, 0.0, 1.0); gl_Position.y *= -1.0; }`;
  const fs = `precision mediump float; varying vec2 uv; uniform sampler2D t; uniform float keyOn, k;
    void main(){
      vec4 c = texture2D(t, vec2(uv.x, 1.0 - uv.y));
      if (keyOn > 0.5) {
        float m = max(c.r, c.b);
        float d = c.g - m;                                   // 綠色比紅藍多多少
        float a = 1.0 - smoothstep(k * 0.45, k, d);          // 越綠越透明，邊緣柔化
        c.g = min(c.g, m + 0.04);                           // 去綠邊（despill）
        gl_FragColor = vec4(c.rgb, a);
      } else gl_FragColor = vec4(c.rgb, 1.0);
    }`;
  function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s); return s; }
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog); gl.useProgram(prog);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0,0, 1,0, 0,1, 0,1, 1,0, 1,1]), gl.STATIC_DRAW);
  const aP = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(aP); gl.vertexAttribPointer(aP, 2, gl.FLOAT, false, 0, 0);
  const uR = gl.getUniformLocation(prog, 'r'), uKeyOn = gl.getUniformLocation(prog, 'keyOn'), uK = gl.getUniformLocation(prog, 'k');
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  function tex() { const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR); return t; }
  const tBg = tex(), tCat = tex();

  function catRect() {                     // 貓咪影片在輸出畫面中的矩形（正規化 0~1）
    const vw = cat.videoWidth || 1080, vh = cat.videoHeight || 1920;
    const w = st.s, h = st.s * st.W * (vh / vw) / st.H;
    return [st.cx - w / 2, st.cy - h / 2, w, h];
  }
  function draw() {
    if (!st.img) return;
    gl.viewport(0, 0, view.width, view.height);
    gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.bindTexture(gl.TEXTURE_2D, tBg); gl.uniform1f(uKeyOn, 0); gl.uniform4f(uR, 0, 0, 1, 1); gl.drawArrays(gl.TRIANGLES, 0, 6);
    if (cat.readyState >= 2) {
      gl.bindTexture(gl.TEXTURE_2D, tCat); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, cat);
      gl.uniform1f(uKeyOn, 1); gl.uniform1f(uK, st.key); gl.uniform4f(uR, ...catRect()); gl.drawArrays(gl.TRIANGLES, 0, 6);
    }
  }
  (function loop() { draw(); requestAnimationFrame(loop); })();

  function setSize(outW) {
    st.W = outW; st.H = Math.round(outW * st.img.height / st.img.width / 2) * 2;     // 影片編碼需要偶數高度
    view.width = st.W; view.height = st.H;
  }
  function resetPos() {
    const vw = cat.videoWidth || 1080, vh = cat.videoHeight || 1920;
    st.s = DEF.s; st.cx = DEF.cx; $('scale').value = st.s;
    const h = st.s * st.W * (vh / vw) / st.H;
    st.cy = DEF.catY - 0.04 * h;           // 素材裡貓群中心約在影片高度 54% 處
  }

  // ── 選截圖 ──
  async function loadShot(f) {
    if (!f || !f.type.startsWith('image/')) return;
    const img = new Image(); img.src = URL.createObjectURL(f); await img.decode();
    st.img = img; setSize(+$('outW').value);
    gl.bindTexture(gl.TEXTURE_2D, tBg); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
    resetPos();
    $('empty').style.display = 'none'; view.style.display = 'block'; $('hint').style.display = 'block';
    const stage = $('stage'); stage.classList.remove('empty'); stage.removeAttribute('for');   // 有圖之後，點舞台是拖曳貓咪，不再開檔案
    $('pickBtn').textContent = '換一張';
    $('adjustRow').style.display = 'flex'; $('make').disabled = false; $('status').textContent = '';
    cat.muted = true; cat.play().catch(() => {});
    setTimeout(() => $('hint').style.display = 'none', 3500);
  }
  $('pick').onchange = (e) => { loadShot(e.target.files[0]); e.target.value = ''; };
  // 電腦版：截圖直接拖進框裡
  const stageEl = $('stage');
  stageEl.addEventListener('dragover', (e) => { e.preventDefault(); stageEl.classList.add('drag'); });
  stageEl.addEventListener('dragleave', () => stageEl.classList.remove('drag'));
  stageEl.addEventListener('drop', (e) => { e.preventDefault(); stageEl.classList.remove('drag'); loadShot(e.dataTransfer.files[0]); });
  $('outW').onchange = () => { if (!st.img) return; const { s, cx, cy } = st; setSize(+$('outW').value); Object.assign(st, { s, cx, cy }); };
  $('scale').oninput = (e) => st.s = +e.target.value;
  $('key').oninput = (e) => st.key = +e.target.value;
  $('reset').onclick = resetPos;
  $('pickVid').onchange = (e) => { const f = e.target.files[0]; if (!f) return; cat.src = URL.createObjectURL(f);
    cat.onloadedmetadata = () => { if (st.img) resetPos(); cat.play().catch(() => {}); }; $('status').textContent = '已換成你的綠幕影片'; };

  // ── 拖曳／兩指縮放 ──
  const ptrs = new Map(); let pinch0 = null;
  const toNorm = (e) => { const r = view.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height }; };
  view.addEventListener('pointerdown', (e) => { if (st.recording) return; view.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, toNorm(e)); pinch0 = null; });
  view.addEventListener('pointermove', (e) => {
    if (!ptrs.has(e.pointerId) || st.recording) return;
    const prev = ptrs.get(e.pointerId), cur = toNorm(e); ptrs.set(e.pointerId, cur);
    if (ptrs.size === 1) { st.cx += cur.x - prev.x; st.cy += cur.y - prev.y; }
    else if (ptrs.size === 2) {
      const [a, b] = [...ptrs.values()]; const d = Math.hypot((a.x - b.x) * st.W, (a.y - b.y) * st.H);
      if (!pinch0) pinch0 = { d, s: st.s };
      st.s = Math.min(1.6, Math.max(0.3, pinch0.s * d / pinch0.d)); $('scale').value = st.s;
    }
  });
  const up = (e) => { ptrs.delete(e.pointerId); pinch0 = null; };
  view.addEventListener('pointerup', up); view.addEventListener('pointercancel', up);

  // ── 產生影片：canvas 畫面 + 貓咪影片原聲，用 MediaRecorder 即時錄 ──
  let ac, srcNode, dest, lastBlob;
  function pickMime() {
    const list = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'];
    return list.find((m) => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
  }
  $('make').onclick = async () => {
    if (!window.MediaRecorder || !view.captureStream) { $('status').textContent = '這個瀏覽器不支援錄影，請用 iPhone Safari 或 Android Chrome'; return; }
    st.recording = true; $('make').disabled = true; $('pick').disabled = true;
    $('progress').style.display = 'block'; $('status').textContent = '貓貓跳舞中…（請不要切換 App）';
    try {
      if (!ac) { ac = new (window.AudioContext || window.webkitAudioContext)(); srcNode = ac.createMediaElementSource(cat); dest = ac.createMediaStreamDestination(); srcNode.connect(dest); }
      await ac.resume();
      const stream = view.captureStream(30);
      dest.stream.getAudioTracks().forEach((t) => stream.addTrack(t));
      const mime = pickMime();
      const rec = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: st.W >= 1080 ? 10e6 : 6e6 } : undefined);
      const chunks = []; rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
      const done = new Promise((res) => rec.onstop = res);
      cat.pause(); cat.loop = false; cat.muted = false; cat.currentTime = 0;
      await new Promise((r) => cat.onseeked = r);
      rec.start(250); await cat.play();
      const tick = setInterval(() => { const pct = 100 * cat.currentTime / cat.duration;
        $('progress').firstElementChild.style.width = pct.toFixed(1) + '%'; $('status').textContent = `貓貓跳舞中… ${Math.round(pct)}%（請不要切換 App）`; }, 100);
      await new Promise((r) => cat.onended = r);
      await new Promise((r) => setTimeout(r, 150));
      rec.stop(); await done; clearInterval(tick);
      stream.getVideoTracks().forEach((t) => t.stop());
      lastBlob = new Blob(chunks, { type: (rec.mimeType || mime || 'video/mp4').split(';')[0] });
      $('out').src = URL.createObjectURL(lastBlob); $('result').style.display = 'flex'; $('out').play().catch(() => {});
      $('status').textContent = `完成：${(lastBlob.size / 1048576).toFixed(1)} MB`;
    } catch (err) {
      $('status').textContent = '錄製失敗：' + (err && err.message || err);
    } finally {
      cat.loop = true; cat.muted = true; cat.onended = null; cat.play().catch(() => {});
      st.recording = false; $('make').disabled = false; $('pick').disabled = false;
      $('progress').style.display = 'none'; $('progress').firstElementChild.style.width = '0';
    }
  };
  $('again').onclick = () => { $('out').pause(); $('result').style.display = 'none'; };
  $('save').onclick = async () => {
    if (!lastBlob) return;
    const ext = lastBlob.type.includes('webm') ? 'webm' : 'mp4';
    const name = `漲停貓貓_${new Date().toISOString().slice(0, 10)}.${ext}`;
    const file = new File([lastBlob], name, { type: lastBlob.type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === 'AbortError') return; }
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(lastBlob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  };

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
